name: signed-android-release
# Maintainer-controlled release: requires matching custom bootstrap artifact,
# durable signing secrets and explicit evidence of hardware/license review.
on:
  workflow_dispatch:
    inputs:
      bootstrap_run_id:
        description: Successful custom-prefix-bootstrap GitHub Actions run ID
        required: true
        type: string
      version:
        description: Prerelease version, e.g. v0.1.0-rc.1
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android integer versionCode
        required: true
        type: number
      device_test_passed:
        description: Confirm real Android ARM64 install, BYOK, PTY, Accessibility and recovery tests passed
        required: true
        type: boolean
      license_audit_passed:
        description: Confirm binary third-party licenses and notices audited
        required: true
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: ${{ inputs.device_test_passed && inputs.license_audit_passed }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate version and provenance of source bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          PIVRYN_RUN_ID: ${{ inputs.bootstrap_run_id }}
          PIVRYN_TAG: ${{ inputs.version }}
          PIVRYN_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          [[ "$PIVRYN_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] || {
            echo "Only release-candidate tags are allowed until v1 hardware gates pass."
            exit 1
          }
          [[ "$PIVRYN_VERSION_CODE" =~ ^[0-9]+$ ]] && [ "$PIVRYN_VERSION_CODE" -ge 1 ]
          RUN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PIVRYN_RUN_ID" --jq '.head_sha')"
          test "$RUN_SHA" = "$GITHUB_SHA" || {
            echo "Mismatched source build: bootstrap workflow must run on the exact release commit."
            exit 1
          }
          if gh release view "$PIVRYN_TAG" >/dev/null 2>&1; then
            echo "Tag already released; refusing to overwrite release artifacts"
            exit 1
          fi

      - name: Download exact custom-prefix artifact
        uses: actions/download-artifact@v4
        with:
          name: pivryn-custom-prefix-bootstrap
          run-id: ${{ inputs.bootstrap_run_id }}
          github-token: ${{ github.token }}
          path: bootstrap/dist

      - name: Verify bootstrap marker, archive and custom paths
        run: |
          test -f bootstrap/dist/.pivryn-custom-prefix
          test -s bootstrap/dist/bootstrap-aarch64.zip
          python3 bootstrap/verify-custom-prefix.py bootstrap/dist/bootstrap-aarch64.zip com.pivryn
          test "$(head -1 bootstrap/dist/.pivryn-custom-prefix)" = "com.pivryn"
          sha256sum bootstrap/dist/bootstrap-aarch64.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Load maintainer-owned Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.PIVRYN_RELEASE_KEYSTORE_BASE64 }}
          PIVRYN_STORE_PASSWORD: ${{ secrets.PIVRYN_STORE_PASSWORD }}
          PIVRYN_KEY_ALIAS: ${{ secrets.PIVRYN_KEY_ALIAS }}
          PIVRYN_KEY_PASSWORD: ${{ secrets.PIVRYN_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$PIVRYN_STORE_PASSWORD" &&
            test -n "$PIVRYN_KEY_ALIAS" && test -n "$PIVRYN_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pivryn-release.jks"
          chmod 600 "$RUNNER_TEMP/pivryn-release.jks"
          echo "PIVRYN_KEYSTORE_FILE=$RUNNER_TEMP/pivryn-release.jks" >> "$GITHUB_ENV"

      - name: Lint and build signed release APK
        working-directory: android
        env:
          PIVRYN_STORE_PASSWORD: ${{ secrets.PIVRYN_STORE_PASSWORD }}
          PIVRYN_KEY_ALIAS: ${{ secrets.PIVRYN_KEY_ALIAS }}
          PIVRYN_KEY_PASSWORD: ${{ secrets.PIVRYN_KEY_PASSWORD }}
          PIVRYN_VERSION: ${{ inputs.version }}
          PIVRYN_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          ./gradlew --no-daemon :app:lintRelease :app:assembleRelease \
            -PpivrynCustomPrefix=true \
            -PpivrynVersionName="${PIVRYN_VERSION#v}" \
            -PpivrynVersionCode="$PIVRYN_VERSION_CODE"

      - name: Verify signed APK and package identity
        env:
          PIVRYN_TAG: ${{ inputs.version }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/pivryn-release-badging.txt
          grep -q "^package: name='com.pivryn'" /tmp/pivryn-release-badging.txt
          HASH="$(sha256sum "$APK" | cut -d ' ' -f1)"
          printf '%s  %s\n' "$HASH" "pivryn-$PIVRYN_TAG-android-arm64.apk" \
            | tee /tmp/pivryn-sha256sum.txt

      - name: Publish signed release candidate (never an automatic stable release)
        env:
          GH_TOKEN: ${{ github.token }}
          PIVRYN_TAG: ${{ inputs.version }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          gh release create "$PIVRYN_TAG" \
            "$APK#pivryn-$PIVRYN_TAG-android-arm64.apk" \
            /tmp/pivryn-sha256sum.txt \
            --target "$GITHUB_SHA" \
            --title "Pivryn $PIVRYN_TAG" \
            --notes "Signed release candidate. Physical-device and license test sign-offs were explicitly submitted by the maintainer. See docs/RELEASE_BLOCKERS.md for limitations." \
            --prerelease
