# Development CI for Pivryn. This workflow never publishes a production APK.
name: build-apk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Source integrity tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell script syntax
        run: |
          bash -n bootstrap/*.sh bootstrap/patches/*.sh
          git diff --check

  build:
    needs: verify-source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?GitHub runner must provide ANDROID_HOME}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager missing on GitHub runner"
            exit 1
          fi
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"


      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build bundled Pi extensions
        run: |
          (cd extensions/pi-termux-tools && pnpm install --frozen-lockfile && pnpm build)
          (cd extensions/pi-skill-learner && pnpm install --frozen-lockfile && pnpm build)

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build optional Python wheel
        run: |
          python -m pip install --upgrade pip build
          (cd python/skill_learner_dspy && python -m build --wheel)

      - name: Build bootstrap for aarch64
        run: |
          chmod +x bootstrap/build-bootstrap.sh bootstrap/postinstall.sh bootstrap/patches/*.sh
          ./bootstrap/build-bootstrap.sh aarch64

      - name: Lint and assemble development APK
        working-directory: android
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug

      - name: Upload development-only build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pivryn-android-arm64-dev-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7